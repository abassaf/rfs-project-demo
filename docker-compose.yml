services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Express serves both the React frontend and the /api routes on port 3001.
    # No nginx needed — cloudflared tunnels directly to http://server:3001.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - server
    # Cloudflare tunnel ingress must be configured to: http://server:3001
